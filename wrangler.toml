name = "subscription-manager"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Custom Domain for the production Worker
routes = [{ pattern = "sub.chi.qzz.io", custom_domain = true }]

[env.production]
name = "subscription-manager"

[env.staging]
name = "subscription-manager-staging"

# KV 命名空間設定（預設範本不預先設定固定 ID，執行 npm run setup 自動產生）

# 静态资源：托管 public/ 目录下的 JS/CSS/HTML 给浏览器
# 使用方式：瀏覽器造訪 /js/lib/api-client.js 等同於 public/js/lib/api-client.js
# 未命中靜態資源的請求由 Worker fetch handler 處理（預設行為）
[assets]
directory = "./public"
binding = "ASSETS"

# 排程工作設定，每小時檢查一次（UTC）
[triggers]
crons = ["0 * * * *"]

# 環境變數（選填，也可以在 Cloudflare Dashboard 中設定）
[vars]
ENVIRONMENT = "production"
