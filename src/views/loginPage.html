<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <title>登入 · SubsTracker</title>
  <style>
    :root { color-scheme: light dark; --page: #f6f7fb; --card: #fff; --text: #111827; --muted: #6b7280; --border: #e5e7eb; --accent: #6366f1; --accent2: #8b5cf6; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin: 0; background: var(--page); color: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .login-shell { min-height: 100vh; display: grid; place-items: center; padding: 28px 18px; position: relative; overflow: hidden; }
    .login-shell::before { content: ""; position: absolute; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(circle, rgba(99,102,241,.14), transparent 70%); top: -190px; right: -130px; pointer-events: none; }
    .login-shell::after { content: ""; position: absolute; width: 380px; height: 380px; border-radius: 50%; background: radial-gradient(circle, rgba(139,92,246,.12), transparent 70%); bottom: -190px; left: -130px; pointer-events: none; }
    .login-card { width: min(100%, 420px); background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 38px 32px 28px; box-shadow: 0 20px 60px rgba(31,41,55,.08); position: relative; z-index: 1; }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
    .brand-mark { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; color: white; background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 7px 18px rgba(99,102,241,.25); }
    .brand-mark svg { width: 23px; height: 23px; }
    .brand-name { font-size: 18px; font-weight: 750; letter-spacing: -.025em; }
    .brand-caption { margin-top: 2px; color: var(--muted); font-size: 12px; }
    h1 { margin: 0; font-size: 28px; letter-spacing: -.04em; line-height: 1.25; }
    .intro { margin: 10px 0 28px; color: var(--muted); font-size: 14px; line-height: 1.7; }
    .auth-button { display: flex; width: 100%; min-height: 52px; align-items: center; justify-content: center; gap: 10px; padding: 13px 18px; border: 0; border-radius: 13px; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-size: 15px; font-weight: 700; text-decoration: none; box-shadow: 0 7px 16px rgba(99,102,241,.24); transition: transform .18s ease, box-shadow .18s ease; }
    .auth-button:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(99,102,241,.3); }
    .auth-button:focus-visible { outline: 3px solid rgba(99,102,241,.4); outline-offset: 3px; }
    .auth-button svg { width: 19px; height: 19px; flex-shrink: 0; }
    .security-note { display: flex; gap: 10px; margin-top: 20px; padding: 13px 14px; border: 1px solid var(--border); border-radius: 12px; color: var(--muted); font-size: 12px; line-height: 1.65; }
    .security-note svg { width: 17px; height: 17px; margin-top: 1px; flex-shrink: 0; color: var(--accent); }
    .footer { margin-top: 26px; text-align: center; color: var(--muted); font-size: 12px; }
    .footer a { color: inherit; text-underline-offset: 3px; }
    @media (prefers-color-scheme: dark) {
      :root { --page: #111827; --card: #1f2937; --text: #f9fafb; --muted: #9ca3af; --border: #374151; }
      .login-card { box-shadow: 0 20px 60px rgba(0,0,0,.24); }
    }
    html.dark { --page: #111827; --card: #1f2937; --text: #f9fafb; --muted: #9ca3af; --border: #374151; }
    html:not(.dark) { color-scheme: light; }
    @media (max-width: 420px) { .login-card { padding: 30px 23px 24px; border-radius: 20px; } h1 { font-size: 25px; } }
  </style>
  ${themeResources}
</head>
<body>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="17" height="16" rx="3"/><path d="M8 8h8M8 12h5M8 16h8"/></svg>
        </div>
        <div>
          <div class="brand-name">SubsTracker</div>
          <div class="brand-caption">Subscription manager</div>
        </div>
      </div>

      <h1 id="login-title">歡迎回來</h1>
      <p class="intro">登入以管理你的訂閱、追蹤支出與查看服務狀態。</p>

      <a class="auth-button" href="/auth/login">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15" r="1"/></svg>
        使用 CHIAuth 登入
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>

      <div class="security-note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/><path d="m9 12 2 2 4-4"/></svg>
        <span>接下來會前往 CHIAuth，使用 Passkey 完成身分驗證。SubsTracker 不會取得或儲存你的 Passkey。</span>
      </div>

      <div class="footer">安全登入由 <a href="https://auth.chi.qzz.io" rel="noreferrer">CHIAuth</a> 提供</div>
    </section>
  </main>
</body>
</html>
